version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: money-assistant-api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - APP_NAME=Money Assistant API
      - MONGODB_URI=mongodb://mongo:27017/money_assistant?replicaSet=rs0
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-change_in_production_access_secret_min_32}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change_in_production_refresh_secret_min_32}
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - BCRYPT_SALT_ROUNDS=12
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:19006}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=gpt-4o-mini
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - money-net

  mongo:
    image: mongo:7.0
    container_name: money-assistant-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    networks:
      - money-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'try { rs.status().ok } catch(e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}]}).ok }'"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
    driver: local

networks:
  money-net:
    driver: bridge
